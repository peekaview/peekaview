name: Release Electron App to Github Releases

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"


jobs:
  create_release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
    - uses: actions/checkout@v4    
      with:
        ref: ${{ github.ref }}  
        
    - name: Get Version
      id: get_version
      working-directory: ./app
      run: |
            VERSION=$(awk -F'"' '/"version"/ {print $4}' package.json)
            echo "Extracted version: $VERSION"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
    - name: Create Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "v${{ steps.get_version.outputs.version }}" \
          --title "PeekaView v${{ steps.get_version.outputs.version }}" \
          --draft
  build_on_linux:
    if: false # temporarily disabled
    needs: create_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
        - name: Check out Git repository
          uses: actions/checkout@v4
          with:
            ref: ${{ github.ref }}

        - name: Install System Dependencies
          run: |
            sudo apt-get update
            sudo apt-get install -y rpm
            sudo snap install snapcraft --classic
            sudo apt-get install -y --no-install-recommends fakeroot

        - uses: pnpm/action-setup@v4
          name: Install pnpm
          with:
            version: 9
            run_install: false
    
        - name: Install Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 20
            cache: 'pnpm'
            cache-dependency-path: 'app/'

        - name: Install Dependencies
          working-directory: ./app
          run: rm -f pnpm-lock.yaml && pnpm install            

        - name: Setup Environment
          working-directory: ./app
          run: |
            echo "VITE_APP_URL=https://develop.peekaview.de/" >> .env
            echo "VITE_API_URL=https://api.peekaview.de/" >> .env
            echo "VITE_CONNECT_SRC=https://*.peekaview.de wss://*.peekaview.de wss://c1.peekaview.de turns:t1.peekaview.de:443 turn:t1.peekaview.de:3478" >> .env
            echo "VITE_RTC_CONTROL_SERVER=wss://c1.peekaview.de/" >> .env
            echo "VITE_RTC_ICE_SERVER={ \"urls\": [\"turns:t1.peekaview.de:443\", \"turn:t1.peekaview.de:3478\"] }" >> .env

        - name: Build Electron App
          working-directory: ./app
          env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          run: pnpm run build:linux

  build_on_mac:
    if: false # temporarily disabled
    needs: create_release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
        - name: Check out Git repository
          uses: actions/checkout@v4
          with:
            ref: ${{ github.ref }}

        - uses: pnpm/action-setup@v4
          name: Install pnpm
          with:
            version: 9
            run_install: false
    
        - name: Install Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 20
            cache: 'pnpm'
            cache-dependency-path: 'app/'

        - name: Install Dependencies
          working-directory: ./app
          run: rm -f pnpm-lock.yaml && pnpm install && pnpm install --global clean-modules  && pnpm clean-modules -y         

        - name: Setup Environment
          working-directory: ./app
          run: |
            echo "VITE_APP_URL=https://develop.peekaview.de/" >> .env
            echo "VITE_API_URL=https://api.peekaview.de/" >> .env
            echo "VITE_CONNECT_SRC=https://*.peekaview.de wss://*.peekaview.de wss://c1.peekaview.de turns:t1.peekaview.de:443 turn:t1.peekaview.de:3478" >> .env
            echo "VITE_RTC_CONTROL_SERVER=wss://c1.peekaview.de/" >> .env
            echo "VITE_RTC_ICE_SERVER={ \"urls\": [\"turns:t1.peekaview.de:443\", \"turn:t1.peekaview.de:3478\"] }" >> .env

        - name: Build Electron App
          working-directory: ./app
          env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
            CSC_LINK: ${{ secrets.CSC_LINK }}
            TEAMID: ${{ secrets.TEAMID }}
            APPLE_ID: ${{ secrets.APPLEID }}
            APPLE_TEAM_ID: ${{ secrets.TEAMID }}
            APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLEIDPASS }}
            NODEBUG: electron-builder
          run: pnpm run build:mac

  build_on_win:
    needs: create_release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
        - name: Check out Git repository
          uses: actions/checkout@v4
          with:
            ref: ${{ github.ref }}

        - uses: pnpm/action-setup@v4
          name: Install pnpm
          with:
            version: 9
            run_install: false
     
        - name: Install Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 20
            cache: 'pnpm'
            cache-dependency-path: 'app/'

        - name: Install Dependencies
          working-directory: ./app
          run: if (Test-Path pnpm-lock.yaml) { Remove-Item pnpm-lock.yaml }; pnpm install; pnpm install --global clean-modules; pnpm clean-modules -y             

        - name: Find windowsSignAzureManager.js
          working-directory: ./app
          run: |
            Write-Host "Searching for windowsSignAzureManager.js..."
            $foundFiles = Get-ChildItem -Path "node_modules" -Recurse -Filter "windowsSignAzureManager.js" -ErrorAction SilentlyContinue
            if ($foundFiles) {
              foreach ($file in $foundFiles) {
                Write-Host "Found at: $($file.FullName)"
              }
            } else {
              Write-Host "No windowsSignAzureManager.js file found"
              Write-Host "Looking for app-builder-lib directory..."
              Get-ChildItem -Path "node_modules" -Directory -Filter "app-builder-lib" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
                Write-Host "Found app-builder-lib at: $($_.FullName)"
                Get-ChildItem -Path $_.FullName -Recurse -Directory | Select-Object -First 10 | ForEach-Object {
                  Write-Host "  Subdirectory: $($_.FullName)"
                }
              }
            }

        - name: Apply patch to windowsSignAzureManager.js
          working-directory: ./app
          run: |
            $filePath = "node_modules/.pnpm/app-builder-lib@26.0.12_dmg-builder@26.0.12_electron-builder-squirrel-windows@26.0.12/node_modules/app-builder-lib/out/codeSign/windowsSignAzureManager.js"
            if (Test-Path $filePath) {
              (Get-Content $filePath) -replace 'Files: `"\$\{options\.path\}`"', 'Files: options.path' | Set-Content $filePath
              Write-Host "Patch applied successfully"
            } else {
              Write-Host "Warning: File not found at $filePath"
              # Try with a more generic approach in case the version changes
              $foundFiles = Get-ChildItem -Path "node_modules/.pnpm" -Recurse -Filter "windowsSignAzureManager.js" -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($foundFiles) {
                $actualFilePath = $foundFiles.FullName
                Write-Host "Found file at: $actualFilePath"
                (Get-Content $actualFilePath) -replace 'Files: `"\$\{options\.path\}`"', 'Files: options.path' | Set-Content $actualFilePath
                Write-Host "Patch applied successfully to found file"
              } else {
                Write-Host "Failed to find windowsSignAzureManager.js in any location"
              }
            }
            
        - name: Setup Environment
          working-directory: ./app
          run: |
             echo "VITE_APP_URL=https://develop.peekaview.de/" >> .env
             echo "VITE_API_URL=https://api.peekaview.de/" >> .env
             echo "VITE_CONNECT_SRC=https://*.peekaview.de wss://*.peekaview.de wss://c1.peekaview.de turns:t1.peekaview.de:443 turn:t1.peekaview.de:3478" >> .env
             echo "VITE_RTC_CONTROL_SERVER=wss://c1.peekaview.de/" >> .env
             echo "VITE_RTC_ICE_SERVER={ `"urls`": [`"turns:t1.peekaview.de:443`", `"turn:t1.peekaview.de:3478`"] }" >> .env

        - name: Build Electron App
          working-directory: ./app
          env:
            AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
            AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
            AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          run: pnpm run build:win