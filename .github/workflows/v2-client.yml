name: v2 desktop client

# manual only (Actions → "v2 desktop client" → Run workflow): every run builds on three
# platforms, so it does not start on pushes / pull requests
on:
  workflow_dispatch:

concurrency:
  group: v2-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: app
          - os: ubuntu-24.04
            bundles: deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: v2

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libssl-dev libxdo-dev \
            libpipewire-0.3-dev libclang-dev libxcb1-dev libxkbcommon-dev libdbus-1-dev \
            libwayland-dev libgbm-dev libegl1-mesa-dev

      # unit tests: encoder (VideoToolbox on macOS), TURN credentials, report helpers;
      # the live tests (#[ignore]) need a desktop session and permissions
      - name: Unit tests
        run: cargo test -p peekaview --locked

      - name: Build app
        working-directory: v2/client
        run: npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: peekaview-${{ runner.os }}
          path: v2/target/release/bundle/
          if-no-files-found: error
