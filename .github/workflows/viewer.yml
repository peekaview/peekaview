name: viewer

on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - 'deploy/**'
      - 'tests/voice.test.mjs'
      - 'LICENSE'
      - '.github/workflows/viewer.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'deploy/**'
      - 'tests/voice.test.mjs'
      - 'LICENSE'
      - '.github/workflows/viewer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: viewer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy
    env:
      CLOUDFLARE_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.15.0
          package_json_file: deploy/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: deploy/pnpm-lock.yaml
      - name: Install deployment tools
        run: pnpm install --frozen-lockfile
      - name: Build and verify public viewer
        run: pnpm test
      - name: Deploy peekaview.de
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm exec wrangler pages deploy dist --project-name peekaview --branch master --commit-hash "$GITHUB_SHA"
          printf 'Viewer deployed: https://peekaview.de\n' >> "$GITHUB_STEP_SUMMARY"
