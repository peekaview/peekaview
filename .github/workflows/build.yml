name: build

# desktop client (Windows, macOS) and Android app; the installers / APK are workflow artifacts
on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/viewer.yml'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/viewer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # superseded PR pushes are cancelled; every master commit gets its builds
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    # our own runner: pull requests from forks must not run code on it
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1

      # unit tests: encoder, TURN credentials, report helpers; the live tests (#[ignore])
      # need a desktop session and permissions
      - name: Unit tests
        run: cargo test -p peekaview --locked

      - name: Build installer
        working-directory: client
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: peekaview-windows-x64
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-15 # Apple Silicon
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1

      - name: Unit tests
        run: cargo test -p peekaview --locked

      # what build.sh does, without installing to /Applications and without a keychain
      # certificate: signed ad hoc, so macOS asks for the permissions again with every build
      - name: Build app
        working-directory: client
        run: npx --yes @tauri-apps/cli@2 build --bundles app

      - name: Sign ad hoc and zip
        working-directory: target/release/bundle/macos
        run: |
          codesign --force --deep --sign - PeekaView.app
          codesign --verify --deep --strict PeekaView.app
          # ditto keeps the bundle's symlinks and executable bits (upload-artifact does not)
          ditto -c -k --keepParent PeekaView.app PeekaView-macos-arm64.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: peekaview-macos-arm64
          path: target/release/bundle/macos/PeekaView-macos-arm64.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      # no release signing key yet: the debug build is the installable one
      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: peekaview-android-test-reports
          path: android/app/build/reports/tests/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: peekaview-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
