<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PeekaView</title>
  <style>
    html, body { margin: 0; height: 100%; background: #09090b; color: #fafafa; }
    body { font: 500 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    #viewer { height: 100%; }
    form { width: min(340px, calc(100% - 32px)); margin: 14vh auto 0; padding: 28px; border-radius: 18px; background: #18181b; border: 1px solid rgba(255,255,255,.08); box-shadow: 0 20px 60px rgba(0,0,0,.4); }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
    .brand i { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: #ef4444; color: #fff; }
    #join label { display: block; margin: 14px 0 0; color: #a1a1aa; font-size: 12px; }
    .lead { margin: 0; color: #a1a1aa; }
    #join input { display: block; box-sizing: border-box; width: 100%; margin-top: 6px; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.1); background: #09090b; color: inherit; font: inherit; outline: none; transition: border-color .15s; }
    #join input:focus { border-color: #ef4444; }
    #join button { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-top: 22px; padding: 11px; border: 0; border-radius: 10px; background: #fafafa; color: #09090b; font: inherit; font-weight: 650; cursor: pointer; }
    #join button:hover { background: #fff; }
  </style>
</head>
<body>
  <form id="join">
    <div class="brand"><i id="logo"></i>PeekaView</div>
    <p class="lead" id="lead">Du wurdest zu einer Bildschirmfreigabe eingeladen.</p>
    <label>Dein Name <input id="name" maxlength="32" required></label>
    <button>Beitreten</button>
  </form>
  <div id="viewer" hidden></div>

  <script type="module">
    import { mountViewer } from './viewer.js'
    import { icon } from './icons.js'

    const $ = (id) => document.getElementById(id)
    $('logo').innerHTML = icon('logo', 20)
    // the room secret travels in the "#…" part of the link – browsers never send it to a server
    const room = decodeURIComponent(location.hash.slice(1))
    const saved = (() => { try { return localStorage.getItem('pv-name') } catch { return null } })()
    $('name').value = new URLSearchParams(location.search).get('name') ?? saved ?? ''
    if (!room) $('lead').textContent = 'Öffne den Link, den du von der teilenden Person bekommen hast.'

    function start() {
      if (!room) return
      const name = $('name').value.trim()
      try { localStorage.setItem('pv-name', name) } catch {}
      $('join').hidden = true
      $('viewer').hidden = false
      mountViewer($('viewer'), { room, name })
    }

    $('join').addEventListener('submit', (e) => { e.preventDefault(); start() })
    if (room && $('name').value) start()
  </script>
</body>
</html>
