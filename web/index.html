<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PeekaView</title>
  <link rel="stylesheet" href="fixed-rooms.css">
  <link rel="stylesheet" href="legal.css">
  <style>
    html, body { margin: 0; height: 100%; background: #09090b; color: #fafafa; }
    [hidden] { display: none !important; }
    body { display: flow-root; font: 500 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    #viewer { position: fixed; inset: 0; height: 100%; overflow: hidden; }
    #contacts-dialog { box-sizing: border-box; width: min(560px, calc(100% - 32px)); max-height: calc(100dvh - 32px); padding: 0; border: 1px solid #3f3f46; border-radius: 18px; background: #18181b; color: #fafafa; box-shadow: 0 24px 80px #0009; }
    #contacts-dialog[open] { display: flex; flex-direction: column; }
    #contacts-dialog::backdrop { background: #0009; }
    .contacts-head { flex: none; display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid #27272a; }
    .contacts-head h2 { margin: 0; font-size: 20px; }
    #contacts-close { flex: none; display: grid; place-items: center; width: 38px; height: 38px; margin-left: auto; padding: 0; border: 1px solid #3f3f46; border-radius: 50%; background: #27272a; color: #fafafa; cursor: pointer; }
    #contacts-close:hover { background: #3f3f46; }
    #contacts-close:focus-visible { outline: 2px solid #fafafa; outline-offset: 2px; }
    #contacts-content { min-height: 0; overflow-y: auto; padding: 20px; }
    #home { box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; width: min(460px, calc(100% - 32px)); margin: 9vh auto 0; padding: 26px; border-radius: 20px; background: #18181b; border: 1px solid rgba(255,255,255,.08); box-shadow: 0 20px 60px rgba(0,0,0,.4); }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
    .brand { flex-wrap: wrap; row-gap: 8px; }
    .brand i { display: flex; color: #fafafa; }
    .pv-trust { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px 3px 7px; border-radius: 999px; background: rgba(34,197,94,.12); color: #86efac; font-size: 11.5px; font-weight: 650; letter-spacing: 0; text-decoration: none; white-space: nowrap; }
    .pv-trust:hover { background: rgba(34,197,94,.2); }
    .pv-trust:focus-visible { outline: 2px solid #fafafa; outline-offset: 2px; }
    .lead { margin: -8px 0 0; color: #a1a1aa; }
    .title { margin: 4px 0 0; font-size: 22px; line-height: 1.25; font-weight: 700; letter-spacing: -.015em; }
    #start .title + .lead { margin-top: -10px; font-size: 15px; }
    #name-note { margin: 6px 0 0; color: #71717a; font-size: 12px; }
    #name-error { margin: 6px 0 0; color: #fca5a5; font-size: 13px; font-weight: 600; }
    #start input.invalid { border-color: #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,.2); }
    #start #name-label { color: #fafafa; font-size: 14px; font-weight: 600; }
    #start #name { padding: 13px 14px; font-size: 16px; }
    #start #paste-link > label { color: #fafafa; font-size: 14px; font-weight: 600; }
    #share-url { padding: 13px 14px !important; font-size: 15px !important; }
    #paste-open.quiet { background:#3f3f46; }
    .other-link { align-self: center; margin-top: -8px; padding: 2px 6px; border: 0; background: none; color: #a1a1aa; font: inherit; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
    .other-link:hover { color: #fafafa; }
    #start { display:flex;flex-direction:column;gap:18px;margin:0; }
    .home-nav { display:flex;gap:6px;padding:4px;border-radius:12px;background:#09090b; }
    .home-nav button { flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:12px 8px;border:0;border-radius:9px;background:transparent;color:#a1a1aa;font:600 13px system-ui;cursor:pointer; }
    .home-nav button[aria-pressed="true"] { background:#3f3f46;color:#fafafa; }
    .home-nav button:focus-visible, #paste-open:focus-visible { outline:2px solid #fafafa;outline-offset:3px; }
    .paste-row { display:flex;align-items:center;gap:8px;margin-top:7px; }
    #start .paste-row input { flex:1;min-width:0;margin:0; }
    #paste-open { padding:14px 18px;border:0;border-radius:10px;background:#ef4444;color:white;font:600 13px system-ui;cursor:pointer; }
    #link-error { margin:8px 0 0;color:#fca5a5;font-size:12px; }
    #recent-links { display:flex;flex-direction:column;gap:10px; }
    #start label { display: block; color: #a1a1aa; font-size: 12px; }
    #start input { display: block; box-sizing: border-box; width: 100%; margin-top: 6px; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.1); background: #09090b; color: inherit; font: inherit; outline: none; transition: border-color .15s; }
    #start input:focus { border-color: #ef4444; }
    .rooms-title { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: -10px; color: #a1a1aa; font-size: 12px; }
    .rooms { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
    .room { position: relative; display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 12px; background: #09090b; border: 1px solid rgba(255,255,255,.07); cursor: pointer; transition: border-color .15s, background .15s; }
    .room:hover { border-color: rgba(255,255,255,.18); }
    .room.selected { border-color: #ef4444; background: rgba(239,68,68,.07); box-shadow: 0 0 0 3px rgba(239,68,68,.15); }
    .room .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: #52525b; }
    .room.online .dot { background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.2); }
    .room.checking .dot { background: transparent; border: 2px solid rgba(255,255,255,.25); border-top-color: #fafafa; width: 8px; height: 8px; animation: spin .8s linear infinite; }
    .room div { flex: 1; min-width: 0; }
    .room strong, .room .sub { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .room strong { font-weight: 650; }
    .room .sub { color: #a1a1aa; font-size: 12px; }
    .room em { flex: none; font-style: normal; font-size: 12px; color: #71717a; }
    .room strong { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 6px; }
    .room strong b { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 650; }
    .room .tags { display: flex; gap: 6px; }
    .room .tags:empty { display: none; }
    .tag { flex: none; display: inline-flex; align-items: center; gap: 3px; padding: 1px 6px; border-radius: 6px; background: rgba(255,255,255,.07); color: #a1a1aa; font: 600 10.5px/1.5 ui-sans-serif, system-ui, sans-serif; letter-spacing: .02em; }
    .tag.permanent { background: rgba(59,130,246,.15); color: #93c5fd; }
    .tag.pin { background: rgba(234,179,8,.14); color: #fde68a; }
    .tag.remote { background: rgba(239,68,68,.14); color: #fca5a5; }
    .tag svg { width: 10px; height: 10px; }
    .room.online em { color: #86efac; }
    .room .forget { position: absolute; top: 6px; right: 6px; display: none; width: 20px; height: 20px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: #71717a; font-size: 14px; line-height: 1; cursor: pointer; }
    .room:hover .forget { display: block; }
    .room:hover em { visibility: hidden; }
    .room .forget:hover { background: rgba(255,255,255,.1); color: #fafafa; }
    .empty { margin: 0; padding: 14px; border-radius: 12px; border: 1px dashed rgba(255,255,255,.12); color: #71717a; text-align: center; font-size: 13px; }
    .connect { display: flex; align-items: center; justify-content: center; gap: 10px; align-self: stretch; height: 52px; margin-top: 4px; border: 0; border-radius: 14px; background: #ef4444; color: #fff; font: 700 16px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .01em; cursor: pointer; box-shadow: 0 10px 30px rgba(239,68,68,.35); transition: background .15s, transform .1s, opacity .15s; }
    .connect:hover:not(:disabled) { background: #dc2626; }
    .connect:active:not(:disabled) { transform: scale(.98); }
    .connect:disabled { opacity: .35; cursor: default; box-shadow: none; }
    .connect-hint { margin: -10px 0 0; text-align: center; color: #a1a1aa; font-size: 13px; }
    .connect-hint:empty { display: none; }
    .share-phone { align-self: center; height: 40px; padding: 0 18px; border-radius: 12px; border: 1px solid rgba(255,255,255,.12); background: #09090b; color: #fafafa; font: 600 14px/1 ui-sans-serif, system-ui, sans-serif; cursor: pointer; }
    .opened { display: flex; flex-direction: column; align-items: center; gap: 14px; margin: 28vh auto 0; padding: 0 24px; text-align: center; color: #fafafa; }
    .opened i { display: flex; color: #71717a; }
    .opened p { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.5; }
    .opened button { padding: 2px 6px; border: 0; background: none; color: #a1a1aa; font: inherit; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
    .open-app { align-self: center; margin-top: -8px; padding: 2px 6px; border: 0; background: none; color: #a1a1aa; font: inherit; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
    .open-app:hover { color: #fafafa; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main id="home">
    <div class="brand"><i id="logo"></i>PeekaView<a id="trust" class="pv-trust" href="sicherheit.html" data-legal title="Wie PeekaView schützt">P2P · Ende-zu-Ende verschlüsselt</a><div id="profile" hidden></div></div>
    <nav class="home-nav" aria-label="Was möchtest du tun?">
      <button type="button" data-home="link" aria-pressed="true">Link öffnen</button>
      <button type="button" data-home="contacts" aria-pressed="false">Kontakte</button>
    </nav>
  <form id="start">
    <h1 class="title" id="title">Bildschirm ansehen</h1>
    <p class="lead" id="lead">Du hast einen Link bekommen? Füge ihn hier ein.</p>
    <div id="paste-link">
      <label>Link einfügen
        <span class="paste-row"><input id="share-url" type="text" inputmode="url" autocomplete="off" placeholder="https://peekaview.de/#…"><button id="paste-open" type="button">Öffnen</button></span>
      </label>
      <p id="link-error" role="alert" hidden></p>
    </div>
    <div id="name-box" hidden>
      <label id="name-label" for="name">Wie heißt du?</label>
      <input id="name" maxlength="32" autocomplete="name" placeholder="z. B. Anna" aria-describedby="name-note name-error">
      <p id="name-error" role="alert" hidden>Bitte gib zuerst deinen Namen ein.</p>
      <p id="name-note">Diesen Namen sieht die teilende Person.</p>
    </div>
    <div id="recent-links" hidden><div class="rooms-title"><span>Zuletzt geöffnet</span><span id="count"></span></div>
    <ul class="rooms" id="rooms"></ul></div>
    <button class="connect" id="connect" hidden disabled>Freigabe ansehen</button>
    <button class="share-phone" id="share-phone" type="button" hidden>Bildschirm dieses Geräts teilen</button>
    <p class="connect-hint" id="hint"></p>
    <button class="open-app" id="open-app" type="button" hidden>In der PeekaView-App öffnen</button>
    <button class="other-link" id="other-link" type="button" hidden>Einen anderen Link öffnen</button>
  </form>
  <section id="fixed-room-entry" hidden><div id="fixed-rooms"></div></section>
    <div id="host-note"></div>
  </main>
  <dialog id="contacts-dialog" aria-labelledby="contacts-title">
    <header class="contacts-head"><h2 id="contacts-title">Kontakte</h2><button id="contacts-close" type="button" aria-label="Kontakte schließen" autofocus></button></header>
    <div id="contacts-content"></div>
  </dialog>
  <div id="opened" class="opened" hidden>
    <i id="opened-logo"></i>
    <p id="opened-text"></p>
    <button id="open-web" type="button">Doch hier im Browser ansehen</button>
  </div>
  <footer class="pv-footer" id="footer"><a href="impressum.html">Impressum</a><a href="datenschutz.html">Datenschutz</a><a href="sicherheit.html">Sicherheit</a></footer>
  <div id="viewer" hidden></div>

  <script type="module">
    // Start page: the room of the opened link (preselected) and the last ten permanent rooms this
    // browser joined, each with its presenter (user@computer), when it was last used and whether
    // it is online right now – asked over the room's encrypted signaling ("ping"), which creates
    // no join request.
    import { mountViewer } from './viewer.js'
    import { downloadCard, mountRooms, openRoom } from './fixed-rooms.js'
    import { icon, owl } from './icons.js'
    import './legal.js'
    import { Signaling, parseRoom } from './signal.js'

    const $ = (id) => document.getElementById(id)
    $('host-note').append(downloadCard())
    mountRooms($('fixed-rooms'), {profileRoot:$('profile'),onIncoming: call => {
      const notice = document.createElement('button')
      notice.textContent = `${call.caller_name} ruft an – Anruf öffnen`
      notice.style.cssText = 'position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:99999;padding:14px;border:1px solid #ef4444;border-radius:12px;background:#18181b;color:white;cursor:pointer'
      notice.onclick = () => openRoom(call.id)
      document.body.append(notice)
      setTimeout(()=>notice.remove(),45000)
    }})
    const KEY = 'pv-rooms'
    const MAX = 10
    $('logo').innerHTML = owl(32)
    $('contacts-close').innerHTML = icon('close',18)
    $('contacts-close').addEventListener('click',()=>$('contacts-dialog').close())
    $('contacts-dialog').addEventListener('close',()=>{
      $('fixed-room-entry').append($('fixed-rooms'))
      const profile=$('profile')
      const menu=profile.querySelector('details')
      if(menu)menu.open=false
      document.querySelector('.brand').append(profile)
    })
    function showContacts(){
      if($('contacts-dialog').open)return
      $('contacts-content').append($('fixed-rooms'))
      $('contacts-close').before($('profile'))
      $('contacts-dialog').showModal()
    }

    const load = () => {
      try {
        return JSON.parse(localStorage.getItem(KEY)) ?? []
      } catch {
        return []
      }
    }
    const store = (list) => {
      try {
        localStorage.setItem(KEY, JSON.stringify(list.slice(0, MAX)))
      } catch {}
    }

    // the room secret travels in the "#…" part of the link – browsers never send it to a server
    // inside the PeekaView app – a viewer window of the desktop app (room from the app) or the
    // Android app (?app=1)
    const params = new URLSearchParams(location.search)
    const inApp = typeof window.__PV_JOIN__ === 'string' || params.get('app') === '1'
    if (typeof window.__PV_JOIN__ === 'string') history.replaceState(null, '', `${location.pathname}#${window.__PV_JOIN__}`)
    let linkRoom = decodeURIComponent(location.hash.slice(1))
    let homeView=linkRoom ? 'link' : (()=>{try{return localStorage.getItem('pv-start-view')==='contacts'?'contacts':'link'}catch{return 'link'}})()
    function showHome(){
      $('home').hidden=!!viewer || !$('opened').hidden
      // not inside the apps, not over a running share
      $('footer').hidden=inApp || !!viewer
      // someone who came with a link has exactly one thing to do: enter a name and join
      document.querySelector('.home-nav').hidden=!!linkRoom
      $('start').hidden=homeView!=='link'
      $('fixed-room-entry').hidden=homeView!=='contacts'
      $('host-note').hidden=inApp || homeView==='contacts' || !!linkRoom
      for(const button of document.querySelectorAll('[data-home]'))button.setAttribute('aria-pressed',String(button.dataset.home===homeView))
      // calls over contacts get their keys from the contacts server: not end-to-end in the strict sense
      $('trust').innerHTML=icon('lock',12)+(homeView==='contacts'?'P2P · verschlüsselt':'P2P · Ende-zu-Ende verschlüsselt')
    }
    for(const button of document.querySelectorAll('[data-home]')){
      button.innerHTML=icon(button.dataset.home==='link'?'link':'users',16)+button.textContent
      button.addEventListener('click',()=>{
        homeView=button.dataset.home
        try{localStorage.setItem('pv-start-view',homeView)}catch{}
        showHome()
      })
    }
    function openPastedLink(){
      const field=$('share-url'),error=$('link-error')
      try{
        const url=new URL(field.value.trim())
        if(url.origin!=='https://peekaview.de' || url.username || url.password)throw new Error()
        if(['/fixed-rooms','/fixed-rooms.html'].includes(url.pathname) && new URLSearchParams(url.hash.slice(1)).has('invite')){
          location.href=new URL('fixed-rooms.html'+url.hash,location.href).href;return
        }
        const room=decodeURIComponent(url.hash.slice(1))
        if(!['/','/index.html'].includes(url.pathname) || !/^[A-Za-z0-9_-]{22}(\.[A-Za-z0-9_-]{43})?$/.test(room))throw new Error()
        error.hidden=true;field.value=''
        if(url.searchParams.has('name'))$('name').value=url.searchParams.get('name').slice(0,32)
        location.hash=room
      }catch{
        error.textContent='Das ist kein PeekaView-Link. Bitte den vollständigen Link einfügen.';error.hidden=false;field.focus()
      }
    }
    $('paste-open').addEventListener('click',openPastedLink)
    // a pasted link opens right away – no need to find the button
    $('share-url').addEventListener('paste',()=>setTimeout(()=>{if(/^\s*https?:/i.test($('share-url').value))openPastedLink()}))
    $('other-link').addEventListener('click',()=>{location.hash=''})
    $('share-url').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();openPastedLink()}})
    const savedName = (() => { try { return localStorage.getItem('pv-name') } catch { return null } })()
    $('name').value = params.get('name') ?? savedName ?? ''
    // remembered as typed
    $('name').addEventListener('input', () => {
      try { localStorage.setItem('pv-name', $('name').value.trim()) } catch {}
      showNameError(false)
    })
    function showNameError(show) {
      $('name-error').hidden = !show
      $('name').classList.toggle('invalid', show)
    }

    // rooms on the page: the link's room first, then the remembered ones
    const status = new Map() // room -> {online, checking, who, room, permanent, name}
    let selected = linkRoom || load()[0]?.room || ''
    const rooms = () => {
      const list = load()
      const all = linkRoom && !list.some((r) => r.room === linkRoom) ? [{ room: linkRoom, link: true }, ...list] : list
      return all
    }

    function ago(ms) {
      if (!ms) return 'noch nie'
      const d = new Date(ms)
      const now = new Date()
      const min = Math.round((now - d) / 60000)
      if (min < 2) return 'gerade eben'
      if (min < 60) return `vor ${min} Min.`
      const day = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime()
      const days = Math.round((day(now) - day(d)) / 86400000)
      const time = d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })
      if (days === 0) return `heute, ${time}`
      if (days === 1) return `gestern, ${time}`
      if (days < 7) return `vor ${days} Tagen`
      return d.toLocaleDateString('de-DE', { day: 'numeric', month: 'long', year: days > 300 ? 'numeric' : undefined })
    }

    function render() {
      showHome()
      const list = rooms()
      $('name-box').hidden=!selected
      $('connect').hidden=!selected
      $('paste-link').hidden=!!linkRoom
      $('paste-open').classList.toggle('quiet',!!selected)
      $('other-link').hidden=!linkRoom
      $('recent-links').hidden=!list.length || !!linkRoom
      $('count').textContent = load().length ? `${load().length} gemerkt` : ''
      if (!list.length) {
        $('rooms').innerHTML = '<li class="empty">Öffne den Link, den du von der teilenden Person bekommen hast.</li>'
      } else {
        $('rooms').replaceChildren(
          ...list.map((r) => {
            const st = status.get(r.room) ?? {}
            const li = document.createElement('li')
            li.className = `room${r.room === selected ? ' selected' : ''}${st.online ? ' online' : ''}${st.checking ? ' checking' : ''}`
            li.innerHTML = '<i class="dot"></i><div><strong></strong><span class="sub"></span></div><em></em>'
            const strong = li.querySelector('strong')
            // the tags stay together – on a narrow screen they move below the name as a group
            strong.innerHTML = '<b></b><span class="tags"></span>'
            strong.querySelector('b').textContent = st.room ?? r.name ?? (r.link ? 'Dieser Link' : 'Raum')
            // what kind of link: permanent or temporary, PIN, remote access (known once answered)
            const permanent = st.permanent ?? r.permanent ?? (r.link ? undefined : true)
            const pin = st.pin ?? r.pin
            const remote = st.remote ?? r.remote
            const tag = (cls, html, title) => strong.lastChild.insertAdjacentHTML('beforeend', `<small class="tag ${cls}" title="${title}">${html}</small>`)
            if (permanent === true) tag('permanent', 'fester Link', 'Fester Link – bleibt immer gleich')
            else if (permanent === false) tag('', 'einmalig', 'Link nur für diese eine Freigabe')
            if (pin) tag('pin', `${icon('lock', 10)}PIN`, 'Eintritt auch mit PIN, ohne Bestätigung')
            if (remote) tag('remote', 'Fernzugriff', 'Fernzugriff: Programme selbst starten')
            const who = st.who ?? r.who
            const last = r.link ? 'neu' : `Zuletzt: ${ago(r.last)}`
            li.querySelector('.sub').textContent = [who, last].filter(Boolean).join(' · ')
            li.querySelector('em').textContent = st.checking ? '' : st.online ? (st.busy ? 'belegt' : 'online') : 'offline'
            if (!r.link) {
              const forget = Object.assign(document.createElement('button'), { type: 'button', className: 'forget', title: 'Vergessen', textContent: '×' })
              forget.addEventListener('click', (e) => {
                e.stopPropagation()
                store(load().filter((x) => x.room !== r.room))
                if (selected === r.room) selected = rooms()[0]?.room ?? ''
                render()
              })
              li.append(forget)
            }
            li.addEventListener('click', () => {
              selected = r.room
              render()
            })
            li.addEventListener('dblclick', () => connect())
            return li
          }),
        )
      }
      const st = status.get(selected)
      $('title').textContent = linkRoom ? (st?.who ? `${st.who} möchte dir den Bildschirm zeigen` : 'Du bist zu einer Bildschirmfreigabe eingeladen') : 'Bildschirm ansehen'
      $('lead').textContent = linkRoom
        ? 'Gib deinen Namen ein und klicke auf „Freigabe ansehen“. Keine Anmeldung, nichts zu installieren.'
        : selected
          ? 'Wähle unten einen Raum – oder füge einen neuen Link ein.'
          : 'Du hast einen Link bekommen? Füge ihn hier ein.'
      $('connect').disabled = !selected
      $('hint').textContent = !selected
        ? ''
        : openedInApp && selected === linkRoom
          ? 'In der PeekaView-App geöffnet – oder hier im Browser verbinden.'
        : gaveUp === selected && !st?.online
          ? 'Es kam keine Verbindung zustande. Ein Link gilt meist nur, solange die Freigabe läuft – bitte die teilende Person um einen neuen Link.'
          : st?.checking
            ? 'Prüfe, ob der Raum online ist …'
            : st?.online
              ? ''
              : 'Die teilende Person ist gerade nicht online. Nach dem Klick wartet PeekaView bis zu 30 Sekunden.'
    }

    // ---------------------------------------------------------------- online check
    async function probe(room) {
      const { secret, hostKey } = parseRoom(room)
      if (!secret) return
      status.set(room, { ...status.get(room), checking: !status.get(room)?.seen })
      render()
      // the presenter answers our own key (the only "from" it takes from us)
      let me
      let answered = false
      const signaling = await Signaling.open({
        secret,
        hostKey,
        onMessage: (m) => {
          if (m.type !== 'pong' || m.to !== me || answered) return
          answered = true
          status.set(room, { online: true, seen: true, who: m.who, room: m.room, busy: m.busy, permanent: !!m.permanent, pin: !!m.pin, remote: !!m.remote })
          // permanent rooms are remembered with their presenter
          if (m.permanent) {
            const list = load()
            const entry = list.find((x) => x.room === room)
            if (entry) {
              Object.assign(entry, { who: m.who, name: m.room, seen: Date.now(), permanent: true, pin: !!m.pin, remote: !!m.remote })
              store(list)
            } else if (room === joined) {
              store([{ room, name: m.room, who: m.who, last: Date.now(), seen: Date.now(), permanent: true, pin: !!m.pin, remote: !!m.remote }, ...list])
            }
          }
          render()
        },
      })
      me = signaling.pubkey
      // ask twice while the relays connect (public relays throttle chatty clients)
      for (let i = 0; i < 2 && !answered; i++) {
        signaling.send({ type: 'ping', from: me })
        await new Promise((r) => setTimeout(r, 2500))
      }
      await new Promise((r) => setTimeout(r, 2000))
      signaling.close()
      // a single lost answer (relays) does not make a room offline
      if (!answered) {
        const before = status.get(room) ?? {}
        const misses = (before.misses ?? 0) + 1
        status.set(room, { ...before, online: before.online && misses < 2, misses, checking: false, seen: true })
      } else {
        status.set(room, { ...status.get(room), misses: 0 })
      }
      render()
    }

    let probeTimer
    // the room joined from this page (remembered once it turns out to be permanent)
    let joined = null
    let viewer = null
    // no connection after this long: back to the start page
    const GIVE_UP = 30000
    let giveUpTimer
    // the room whose connection did not come about (hint on the start page)
    let gaveUp = null
    // connected (or waiting for the presenter's approval – a person, not the network)
    const CONNECTED = ['live', 'loading', 'paused', 'pick', 'locked', 'admission']
    function probeAll() {
      // not while the page is in the background
      if (!document.hidden) for (const r of rooms()) probe(r.room)
      probeTimer = setTimeout(probeAll, 60000)
    }

    // ---------------------------------------------------------------- connect
    function connect() {
      const room = selected
      if (!room) return
      const name = $('name').value.trim()
      if (!name) {
        showNameError(true)
        return $('name').focus()
      }
      try { localStorage.setItem('pv-name', name) } catch {}
      // remember permanent rooms (the newest first)
      const st = status.get(room)
      const list = load()
      const known = list.find((x) => x.room === room)
      if (known || st?.permanent) {
        const entry = { ...(known ?? {}), room, name: st?.room ?? known?.name, who: st?.who ?? known?.who, last: Date.now(), permanent: true, pin: st?.pin ?? known?.pin, remote: st?.remote ?? known?.remote }
        store([entry, ...list.filter((x) => x.room !== room)])
      }
      clearTimeout(probeTimer)
      joined = room
      if (!st) probe(room)
      if (location.hash.slice(1) !== room) history.replaceState(null, '', `${location.pathname}${location.search}#${room}`)
      $('home').hidden = true
      $('footer').hidden = true
      $('viewer').hidden = false
      gaveUp = null
      viewer = mountViewer($('viewer'), {
        onRooms: showContacts,
        room,
        name,
        onStatus: (status) => {
          if (CONNECTED.includes(status)) {
            clearTimeout(giveUpTimer)
            giveUpTimer = undefined
          } else if (!giveUpTimer) {
            giveUpTimer = setTimeout(() => {
              leave()
              gaveUp = room
              render()
            }, GIVE_UP)
          }
        },
      })
    }

    /** Back to the start page. */
    function leave() {
      $('contacts-dialog').close()
      clearTimeout(giveUpTimer)
      giveUpTimer = undefined
      viewer?.destroy()
      viewer = null
      joined = null
      $('viewer').hidden = true
      showHome()
      probeAll()
    }

    // another room link opened in this tab (only the "#…" changed): join that one
    window.addEventListener('hashchange', () => {
      const room = decodeURIComponent(location.hash.slice(1))
      if (!room) {
        linkRoom='';selected=load()[0]?.room || ''
        if(viewer)leave()
        render();return
      }
      if (room === joined) return
      homeView='link'
      linkRoom = selected = room
      if (viewer) leave()
      if ($('name').value.trim()) connect()
      else {
        render()
        $('name').focus()
      }
    })

    $('start').addEventListener('submit', (e) => {
      e.preventDefault()
      if(!selected)openPastedLink();else connect()
    })

    // ---------------------------------------------------------------- open in the PeekaView app
    // Installed, it handles "peekaview://join" and shows the share in a window of its own. Whether
    // it is installed only shows when the page loses the focus to it – remembered from then on.
    const APP_KEY = 'pv-app'
    const appKnown = () => { try { return localStorage.getItem(APP_KEY) === '1' } catch { return false } }
    let openedInApp = false
    function openInApp(room, gesture) {
      const st = status.get(room) ?? {}
      const known = load().find((x) => x.room === room) ?? {}
      const q = new URLSearchParams({ room })
      const name = st.room ?? known.name
      const who = st.who ?? known.who
      if (name) q.set('name', name)
      if (who) q.set('who', who)
      const url = `peekaview://join?${q}`
      // the app took over: this page has nothing more to do
      const onBlur = () => {
        openedInApp = true
        try { localStorage.setItem(APP_KEY, '1') } catch {}
        clearTimeout(probeTimer)
        $('home').hidden = true
        $('opened-text').textContent = /Android/i.test(navigator.userAgent)
          ? 'In der PeekaView-App geöffnet. Du kannst dieses Fenster schließen.'
          : 'In PeekaView Desktop geöffnet. Du kannst dieses Fenster schließen.'
        $('opened').hidden = false
      }
      window.addEventListener('blur', onBlur, { once: true })
      setTimeout(() => window.removeEventListener('blur', onBlur), 3000)
      if (/Android/i.test(navigator.userAgent)) {
        // Android: an intent – without the app, Chrome stays on this page
        if (!gesture) return
        location.href = `intent://join?${q}#Intent;scheme=peekaview;package=de.limtec.peekaview;S.browser_fallback_url=${encodeURIComponent(location.href)};end`
      } else if (gesture || appKnown()) {
        location.href = url
      } else {
        // a first try without a click: unknown schemes fail silently in a hidden frame
        const frame = Object.assign(document.createElement('iframe'), { hidden: true, src: url })
        document.body.append(frame)
        setTimeout(() => frame.remove(), 3000)
      }
    }
    $('opened-logo').innerHTML = owl(40)
    $('open-web').addEventListener('click', () => {
      $('opened').hidden = true
      render()
      probeAll()
    })
    $('open-app').hidden = inApp || !linkRoom
    $('open-app').textContent = /Android/i.test(navigator.userAgent) ? 'In der PeekaView-App öffnen' : 'In PeekaView Desktop öffnen'
    // the Android app shares the phone's screen
    $('share-phone').hidden = !window.PeekaViewApp
    $('share-phone').addEventListener('click', () => window.PeekaViewApp?.share())
    $('open-app').addEventListener('click', () => openInApp(selected || linkRoom, true))

    render()
    // a link with ?name=… (integrations, tests) – or opened in the app with a known name – joins right away
    if (linkRoom && (params.has('name') || (inApp && $('name').value.trim()))) connect()
    else {
      probeAll()
      if (linkRoom && !$('name').value) $('name').focus()
      if (linkRoom && !inApp) openInApp(linkRoom, false)
    }
  </script>
</body>
</html>
