<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PeekaView light</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #18181b; color: #fafafa; }
    [hidden] { display: none !important; }
    body { font: 500 13px/1.35 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; user-select: none; }
    /* in the corner: who watches, who wants in */
    #parked { box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; }
    .row { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .row > span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row > .owl { flex: none; display: flex; color: #fafafa; }
    .title { font-weight: 700; }
    .light { padding: 1px 7px; border-radius: 999px; background: #27272a; color: #a1a1aa; font-size: 11px; font-weight: 650; }
    .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,.25); }
    .muted { color: #a1a1aa; }
    .thumb { flex: none; width: 64px; height: 40px; border-radius: 6px; background: #000; object-fit: contain; }
    button { display: inline-flex; align-items: center; justify-content: center; gap: 5px; height: 28px; padding: 0 10px; border: 0; border-radius: 8px; background: #3f3f46; color: #fafafa; font: 650 12px/1 ui-sans-serif, system-ui, sans-serif; cursor: pointer; white-space: nowrap; }
    button:hover { background: #52525b; }
    button.primary { background: #ef4444; }
    button.primary:hover { background: #dc2626; }
    button.icon { width: 28px; padding: 0; }
    .request { padding: 7px 8px; border-radius: 9px; border: 1px solid rgba(239,68,68,.5); background: rgba(239,68,68,.1); }
    /* somebody is drawing: it shows up as soon as they let go */
    #busy { padding: 7px 9px; border-radius: 9px; background: #27272a; color: #fafafa; }
    #busy .dot { animation: pulse 1s ease-in-out infinite; box-shadow: none; }
    @keyframes pulse { 50% { opacity: .35; } }
    /* jumped to a spot: the frozen picture under the helper 1:1, with the drawing on top */
    #focus { position: fixed; inset: 0; overflow: hidden; background: #09090b; cursor: crosshair; touch-action: none; }
    #stage, #backdrop { position: absolute; }
    #shot { position: absolute; inset: 0; width: 100%; height: 100%; }
    #focus-bar { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; align-items: center; gap: 8px; pointer-events: none; }
    #focus-bar > * { pointer-events: auto; }
    .chip { display: inline-flex; align-items: center; gap: 7px; min-width: 0; height: 28px; padding: 0 11px; border-radius: 999px; background: rgba(24,24,27,.85); border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 4px 14px rgba(0,0,0,.35); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #focus-bar .chip { flex: 0 1 auto; }
    #focus-bar .spacer { flex: 1; }
    #focus-close { box-shadow: 0 4px 14px rgba(0,0,0,.35); }
    #focus-hint { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); max-width: calc(100% - 16px); color: #d4d4d8; font-size: 11.5px; pointer-events: none; }
    /* the edge says: this is not your screen, it is a picture of it */
    #focus::after { content: ""; position: absolute; inset: 0; border: 3px solid #ef4444; border-radius: 2px; pointer-events: none; }
    #waiting { box-sizing: border-box; display: flex; align-items: center; gap: 10px; height: 100%; padding: 12px 14px; }
    .offscreen { position: fixed; left: 0; top: 0; width: 2px; height: 2px; opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="waiting"><span class="owl" id="owl-waiting"></span><span>Wähle im Browser aus, was du teilen möchtest …</span></div>

  <div id="parked" hidden>
    <div class="row"><span class="owl" id="owl"></span><span><span class="title">Freigabe läuft</span> <span class="light">im Browser</span></span><button class="icon" id="stop" title="Freigabe beenden" aria-label="Freigabe beenden"></button></div>
    <div class="row"><video class="thumb" id="video" muted autoplay playsinline></video><span class="muted" id="viewers">Noch niemand schaut zu</span></div>
    <div class="row" id="busy" role="status" hidden><i class="dot"></i><span></span></div>
    <div class="row"><button id="copy">Link kopieren</button><button id="show" title="Den geteilten Bildschirm hier zeigen und selbst darauf zeigen oder malen">Selbst zeigen</button></div>
    <div id="requests"></div>
  </div>

  <div id="focus" hidden>
    <canvas id="backdrop" hidden></canvas>
    <div id="stage"><canvas id="shot"></canvas></div>
    <div id="focus-bar"><span class="chip" id="focus-who"></span><span class="spacer"></span><button class="icon" id="focus-close" title="Zurück in die Ecke" aria-label="Zurück in die Ecke"></button></div>
    <span class="chip" id="focus-hint">Standbild – du kannst hier auch selbst zeigen und malen.</span>
  </div>
  <!-- the whole screen, only to find the shared window on it (never sent) -->
  <video class="offscreen" id="screen-video" muted autoplay playsinline></video>

  <script type="module">
    // The helper window of "Bildschirmfreigabe light" (opened by share.html).
    // Waits small in a corner of the screen. When a viewer points – or has finished a stroke – it
    // jumps to that spot, grows, and shows a still picture of the shared screen there with the
    // stroke drawn again on top – like a pane of glass over the spot – and slips back into the
    // corner afterwards. While somebody draws it says so in the corner; the picture is taken when
    // the stroke starts, so it shows what they drew on. The presenter can point and draw into it
    // too; that goes to the viewers.
    //
    // Where the spot is (light-geometry.js): a shared screen maps directly; a shared window is
    // found on the screen by its picture (light-locate.js) when the presenter also picked the
    // whole screen. Otherwise the helper shows the whole picture in the middle of the screen.
    //
    // Browser limits:
    //   - Only windows a page opened itself can be moved and resized (window.open with "popup"),
    //     and only within the screen. Firefox may forbid it (dom.disable_window_move_resize).
    //   - A page cannot keep a window on top of other apps; focus() brings it forward where the
    //     browser allows it (Chrome mostly, Firefox and Safari rarely).
    import { Annotations } from './annotate.js'
    import { icon, owl } from './icons.js'
    import { HOST_ID } from './light-host.js'
    import { bounds, fit, inside, matchesScreen, monitorRect, spotRect, stageInContent, visiblePart, windowRect } from './light-geometry.js'
    import { locate, scaledGray } from './light-locate.js'

    const $ = (id) => document.getElementById(id)
    $('owl').innerHTML = owl(20)
    $('owl-waiting').innerHTML = owl(24)
    $('stop').innerHTML = icon('stop', 14)
    $('focus-close').innerHTML = icon('close', 15)
    $('copy').prepend(document.createRange().createContextualFragment(icon('copy', 13)))
    $('show').prepend(document.createRange().createContextualFragment(icon('draw', 13)))

    const mac = /Mac/.test(navigator.platform)
    const PARKED_WIDTH = 300
    const SPOT = { width: 560, height: 400 }
    // back into the corner after this long without anybody pointing or drawing
    const AFTER_PING = 3500
    const AFTER_DRAW = 6000

    const api = window.opener?.pvLight
    if (!api) {
      document.body.textContent = 'Dieses Fenster gehört zu einer Bildschirmfreigabe im Browser. Starte sie auf peekaview.de.'
      throw new Error('no share')
    }

    let status = { sharing: false }
    let started = false
    let state = 'waiting' // waiting | parked | focus
    let shown = null // what the focus shows: {image, picture, monitor} (picture: where it lies on the screen, null: unknown)
    let part = null // the part of the picture (0..1) the focus shows
    let stageBox = null // where the whole picture lies in the window (CSS px)
    let spotLayout = false
    let idleTimer
    // strokes of viewers in progress: from -> {live} (drawn right away, inside the focus) or
    // {points, capture, name} (shown when they let go)
    const strokes = new Map()
    // one jump after the other
    let queue = Promise.resolve()
    const ann = new Annotations($('stage'), { voice: false })

    // ---------------------------------------------------------------- from the share page
    function onStatus(s) {
      status = s
      if (s.peers) ann.handle({ t: 'peers', list: s.peers })
      if (s.sharing && !started) {
        started = true
        play($('video'), api.stream)
        park()
      } else if (!s.sharing && started) {
        window.close()
      }
      if ((api.locatorStream ?? null) !== $('screen-video').srcObject) play($('screen-video'), api.locatorStream)
      if (state === 'parked') renderParked()
    }

    function play(video, stream) {
      try {
        video.srcObject = stream ?? null
        if (stream) video.play().catch(() => {})
      } catch {}
    }

    const nameOf = (id) => (id === HOST_ID ? 'Du' : (status.peers ?? []).find((p) => p.id === id)?.name ?? 'Jemand')

    function onAnnotation(m) {
      if (m.t === 'peers' || m.t === 'state') return ann.handle(m)
      if (!started) return
      if (m.t === 'draw') return onDraw(m)
      if (m.t === 'ping') return onPing(m)
      // cursors, hiding, clearing: only while something is shown
      if (state === 'focus') ann.handle(m)
    }

    const insideShown = (p) => state === 'focus' && part && inside(p, part, spotLayout ? 0.08 : 0)

    function onPing(m) {
      if (insideShown(m)) return pinged(m)
      const capture = takeCapture()
      enqueue(async () => {
        await show(await capture, m)
        pinged(m)
      })
    }

    function pinged(m) {
      ann.handle(m)
      // (the ring is short: once more when the helper has arrived)
      setTimeout(() => state === 'focus' && ann.ping(m.from, m.x, m.y), 450)
      showWho(m.from)
      idle(AFTER_PING)
    }

    function onDraw(m) {
      let stroke = strokes.get(m.from)
      if (m.s === 'start' || !stroke) {
        // inside what is shown already: drawn right away
        if (insideShown(m)) {
          strokes.set(m.from, { live: true })
          clearTimeout(idleTimer)
          showWho(m.from)
          return ann.handle({ ...m, s: 'start' })
        }
        // otherwise the picture now (that is what they draw on), shown when they let go
        stroke = { points: [[m.x, m.y]], capture: takeCapture(), name: nameOf(m.from) }
        strokes.set(m.from, stroke)
        renderBusy()
        return
      }
      if (stroke.live) {
        ann.handle(m)
        if (m.s === 'end') {
          strokes.delete(m.from)
          idle(AFTER_DRAW)
        }
        return
      }
      if (stroke.points.length < 4000) stroke.points.push([m.x, m.y])
      if (m.s !== 'end') return
      strokes.delete(m.from)
      renderBusy()
      enqueue(async () => {
        const b = bounds(stroke.points)
        await show(await stroke.capture, { x: b.x + b.w / 2, y: b.y + b.h / 2 }, b)
        showWho(m.from)
        await replay(m.from, stroke.points)
        idle(AFTER_DRAW)
      })
    }

    function enqueue(task) {
      queue = queue.then(task).catch((err) => console.warn('peekaview light helper', err))
    }

    /** A stroke drawn again, quickly (it shows up as it was drawn). */
    function replay(id, points) {
      return new Promise((done) => {
        const at = (i, s) => ann.handle({ t: 'draw', from: id, s, x: points[i][0], y: points[i][1] })
        at(0, 'start')
        if (points.length === 1) {
          at(0, 'end')
          return done()
        }
        const duration = Math.min(1200, Math.max(400, points.length * 12))
        const t0 = performance.now()
        let i = 1
        const step = () => {
          const until = Math.min(points.length, Math.ceil(((performance.now() - t0) / duration) * points.length))
          for (; i < until; i++) at(i, i === points.length - 1 ? 'end' : 'move')
          if (i < points.length) requestAnimationFrame(step)
          else done()
        }
        requestAnimationFrame(step)
      })
    }

    // ---------------------------------------------------------------- in the corner
    function renderParked() {
      const viewers = status.viewers ?? []
      $('viewers').textContent = viewers.length === 0 ? 'Noch niemand schaut zu' : viewers.length === 1 ? `${viewers[0].name} schaut zu` : `${viewers.length} schauen zu`
      $('show').hidden = !viewers.length
      $('requests').replaceChildren(...(status.requests ?? []).map((r) => {
        const row = document.createElement('div')
        row.className = 'row request'
        row.innerHTML = '<span></span><button data-deny>Ablehnen</button><button class="primary" data-allow>Zulassen</button>'
        row.querySelector('span').textContent = `${r.name} möchte zusehen`
        row.querySelector('[data-allow]').addEventListener('click', () => api.admit(r.peer, true))
        row.querySelector('[data-deny]').addEventListener('click', () => api.admit(r.peer, false))
        return row
      }))
      if (state === 'parked') placeParked()
    }

    function renderBusy() {
      const names = [...strokes.values()].filter((s) => !s.live).map((s) => s.name)
      const busy = $('busy')
      busy.hidden = !names.length
      busy.querySelector('span').textContent = names.length === 1 ? `${names[0]} malt gerade …` : `${names.join(' und ')} malen gerade …`
      if (state === 'parked') placeParked()
    }

    function park() {
      clearTimeout(idleTimer)
      state = 'parked'
      part = null
      shown = null
      ann.reset()
      $('waiting').hidden = true
      $('focus').hidden = true
      $('parked').hidden = false
      renderParked()
    }

    function chrome() {
      return { x: Math.max(0, window.outerWidth - window.innerWidth), y: Math.max(0, window.outerHeight - window.innerHeight) }
    }

    // bottom right of the usable area of the screen
    function placeParked() {
      const c = chrome()
      const height = Math.ceil($('parked').scrollHeight)
      const w = PARKED_WIDTH + c.x
      const h = height + c.y
      moveWindow((screen.availLeft ?? 0) + screen.availWidth - w - 16, (screen.availTop ?? 0) + screen.availHeight - h - 16, w, h)
    }

    function moveWindow(left, top, width, height) {
      try {
        window.resizeTo(Math.round(width), Math.round(height))
        window.moveTo(Math.round(left), Math.round(top))
      } catch {}
    }

    $('stop').addEventListener('click', () => api.stop())
    $('copy').addEventListener('click', () => api.copyLink())
    $('show').addEventListener('click', () => {
      const capture = takeCapture()
      enqueue(async () => {
        // the presenter wants to show something: the whole picture
        await show({ ...(await capture), picture: null }, null)
        showWho(HOST_ID)
        idle(AFTER_DRAW * 2)
      })
    })
    $('focus-close').addEventListener('click', park)
    window.addEventListener('keydown', (e) => e.key === 'Escape' && state === 'focus' && park())

    // ---------------------------------------------------------------- the picture and where it lies

    /**
     * A still picture of the shared screen or window, and where it lies on the screen – taken
     * while the helper still sits in its corner.
     */
    async function takeCapture() {
      const monitor = monitorRect(screen, { mac, details: await screenDetails() })
      const image = await frameCanvas(api.stream, $('video'))
      let picture = null
      let screenImage = null
      if (image && status.surface === 'monitor' && matchesScreen(status.video, monitor)) picture = monitor
      else if (image && api.locatorStream) ({ picture, screenImage } = await findWindow(image, monitor))
      return { image, picture, monitor, screenImage }
    }

    // the shared window on the screen (the presenter also picked the whole screen)
    async function findWindow(image, monitor) {
      const track = api.locatorStream?.getVideoTracks()[0]
      const size = track?.getSettings?.() ?? {}
      if (!track || track.readyState !== 'live' || !matchesScreen(size, monitor)) return {}
      const screenFrame = await frameCanvas(api.locatorStream, $('screen-video'))
      if (!screenFrame) return {}
      const scratch = document.createElement('canvas')
      const found = locate((w, h) => scaledGray(screenFrame, w, h, scratch), (w, h) => scaledGray(image, w, h, scratch), screenFrame, image)
      window.pvHelper.found = found
      // the desktop around the window, too: the helper is a pane of glass over that spot
      return found ? { picture: windowRect(found, monitor), screenImage: screenFrame } : {}
    }

    /** The current frame of a stream as a canvas (ImageCapture where there is one, else the video). */
    async function frameCanvas(stream, video) {
      const track = stream?.getVideoTracks()[0]
      let source = null
      try {
        if (track && typeof ImageCapture === 'function') source = await new ImageCapture(track).grabFrame()
      } catch {}
      if (!source && video.videoWidth) source = video
      if (!source) return null
      const canvas = document.createElement('canvas')
      canvas.width = source.width || video.videoWidth
      canvas.height = source.height || video.videoHeight
      canvas.getContext('2d').drawImage(source, 0, 0, canvas.width, canvas.height)
      source.close?.()
      return canvas
    }

    // ---------------------------------------------------------------- jumping to a spot

    /** Shows a capture: 1:1 over `center` (0..1 of the picture), large enough for `extent`. */
    async function show(capture, center, extent = { w: 0, h: 0 }) {
      shown = capture
      const shot = $('shot')
      if (capture.image) {
        shot.width = capture.image.width
        shot.height = capture.image.height
        shot.getContext('2d').drawImage(capture.image, 0, 0)
      }
      const backdrop = $('backdrop')
      backdrop.hidden = !capture.screenImage || !center
      if (!backdrop.hidden) {
        backdrop.width = capture.screenImage.width
        backdrop.height = capture.screenImage.height
        backdrop.getContext('2d').drawImage(capture.screenImage, 0, 0)
      }
      ann.reset()
      state = 'focus'
      $('waiting').hidden = true
      $('parked').hidden = true
      $('focus').hidden = false
      const c = chrome()
      const { picture, monitor } = capture
      if (picture && center) {
        // large enough for the whole stroke (with a margin), at most most of the screen
        const size = {
          width: Math.min(monitor.width * 0.85, Math.max(SPOT.width, extent.w * picture.width + 160)),
          height: Math.min(monitor.height * 0.85, Math.max(SPOT.height, extent.h * picture.height + 160)),
        }
        const r = spotRect(center, picture, size, monitor)
        // the content area (not the title bar) over the spot
        moveWindow(r.left - c.x / 2, r.top - (c.y - c.x / 2), r.width + c.x, r.height + c.y)
        layoutSpot()
        // where the browser actually put it (it keeps windows on the screen)
        await new Promise((done) => setTimeout(done, 150))
        if (shown === capture) layoutSpot()
      } else {
        const box = { width: screen.availWidth * 0.6, height: screen.availHeight * 0.6 }
        const f = fit(capture.image ?? { width: 16, height: 9 }, box)
        moveWindow((screen.availLeft ?? 0) + (screen.availWidth - f.width) / 2, (screen.availTop ?? 0) + (screen.availHeight - f.height) / 2, f.width + c.x, f.height + c.y)
        layoutWhole()
        await new Promise((done) => setTimeout(done, 150))
        if (shown === capture) layoutWhole()
      }
      try { window.focus() } catch {}
    }

    function layoutSpot() {
      spotLayout = true
      const c = chrome()
      const content = { left: window.screenX + c.x / 2, top: window.screenY + c.y - c.x / 2, width: window.innerWidth, height: window.innerHeight }
      place(stageInContent(content, shown.picture))
      const b = stageInContent(content, shown.monitor)
      Object.assign($('backdrop').style, { left: `${b.left}px`, top: `${b.top}px`, width: `${b.width}px`, height: `${b.height}px` })
      part = visiblePart(content, shown.picture)
    }

    function layoutWhole() {
      spotLayout = false
      place(fit(shown?.image ?? { width: 16, height: 9 }, { width: window.innerWidth, height: window.innerHeight }))
      part = { x: 0, y: 0, w: 1, h: 1 }
    }

    window.addEventListener('resize', () => state === 'focus' && !spotLayout && layoutWhole())

    function place(box) {
      stageBox = box
      Object.assign($('stage').style, { left: `${box.left}px`, top: `${box.top}px`, width: `${box.width}px`, height: `${box.height}px` })
      ann.resize()
    }

    // a screen of several: where it is exactly – only when the presenter allowed it already
    // (Chrome's "window management"; we never ask for it here)
    let detailsAllowed
    async function screenDetails() {
      try {
        if (!('getScreenDetails' in window)) return null
        detailsAllowed ??= (await navigator.permissions.query({ name: 'window-management' })).state === 'granted'
        if (!detailsAllowed) return null
        return (await window.getScreenDetails()).currentScreen
      } catch {
        return null
      }
    }

    function showWho(id) {
      const p = (status.peers ?? []).find((x) => x.id === id)
      const chip = $('focus-who')
      chip.textContent = ''
      const dot = document.createElement('i')
      dot.className = 'dot'
      dot.style.background = p?.color ?? '#a1a1aa'
      dot.style.boxShadow = 'none'
      chip.append(dot, id === HOST_ID ? 'Du zeigst' : `${p?.name ?? 'Jemand'} zeigt hier`)
    }

    function idle(ms) {
      clearTimeout(idleTimer)
      idleTimer = setTimeout(function check() {
        // nobody lets go of a stroke halfway: wait for it
        if (strokes.size > 0 || down) return (idleTimer = setTimeout(check, 1000))
        park()
      }, ms)
    }

    // ---------------------------------------------------------------- the presenter draws here
    let down = null
    let lastMove = 0
    const pos = (e) => {
      const r = $('stage').getBoundingClientRect()
      return { x: Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), y: Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)) }
    }
    const focusEl = $('focus')
    focusEl.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button') || state !== 'focus') return
      e.preventDefault()
      focusEl.setPointerCapture?.(e.pointerId)
      const p = pos(e)
      down = { x: e.clientX, y: e.clientY, p, drawing: false }
      clearTimeout(idleTimer)
      showWho(HOST_ID)
    })
    focusEl.addEventListener('pointermove', (e) => {
      if (state !== 'focus') return
      const now = performance.now()
      if (now - lastMove < (down ? 16 : 33)) return
      lastMove = now
      const p = pos(e)
      if (down && !down.drawing && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 4) {
        down.drawing = true
        ann.draw(HOST_ID, 'start', down.p.x, down.p.y)
        api.annotate({ t: 'draw', s: 'start', ...down.p })
      }
      if (down?.drawing) {
        ann.draw(HOST_ID, 'move', p.x, p.y)
        api.annotate({ t: 'draw', s: 'move', ...p })
      } else {
        api.annotate({ t: 'ptr', ...p })
      }
    })
    const release = (e) => {
      if (!down) return
      const p = pos(e)
      if (down.drawing) {
        ann.draw(HOST_ID, 'end', p.x, p.y)
        api.annotate({ t: 'draw', s: 'end', ...p })
      } else {
        // a click: a ping
        ann.ping(HOST_ID, p.x, p.y)
        api.annotate({ t: 'ping', ...p })
      }
      down = null
      idle(AFTER_DRAW)
    }
    focusEl.addEventListener('pointerup', release)
    focusEl.addEventListener('pointercancel', release)
    focusEl.addEventListener('pointerleave', () => !down && state === 'focus' && api.annotate({ t: 'hide' }))

    // (tests and debugging)
    window.pvHelper = {
      get state() { return state },
      get part() { return part },
      get stage() { return stageBox },
      get picture() { return shown?.picture ?? null },
      get busy() { return $('busy').hidden ? '' : $('busy').textContent },
      found: null,
      park,
    }

    // ---------------------------------------------------------------- connected to the share page
    const unsubscribe = api.subscribe((e) => {
      if (e.kind === 'status') onStatus(e)
      else if (e.kind === 'ann') onAnnotation(e.m)
    })
    window.addEventListener('pagehide', () => unsubscribe())
    // the share page is gone (closed, reloaded): so is the share
    setInterval(() => {
      if (!window.opener || window.opener.closed) window.close()
    }, 1000)
  </script>
</body>
</html>
