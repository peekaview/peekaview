<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>PeekaView</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../fixed-rooms.css">
</head>
<body class="app">
  <header class="app-head">
    <span id="logo" class="logo"></span>
    <strong>PeekaView</strong>
    <span id="live-badge" class="live-badge" hidden><i class="dot"></i>Freigabe läuft – Auswahl ändern</span>
    <div id="profile" hidden></div>
    <button id="settings-btn" class="icon-btn" title="Einstellungen" data-icon="settings"></button>
  </header>

  <main>
    <div id="requests" class="requests" hidden></div>

    <div id="perm-banner" class="banner" hidden>
      <i data-icon="screen"></i>
      <div><strong>Bildschirmaufnahme nicht erlaubt</strong><span>macOS muss PeekaView das Teilen einmalig erlauben.</span></div>
      <button id="perm-fix" class="pill secondary">Erlauben</button>
    </div>
    <div id="net-banner" class="banner" hidden>
      <i data-icon="users"></i>
      <div><strong>Handys im WLAN können nicht zusehen</strong><span>macOS muss PeekaView das lokale Netzwerk erlauben.</span></div>
      <button id="net-fix" class="pill secondary">Erlauben</button>
    </div>
    <div id="invite" class="banner" hidden>
      <i data-icon="link"></i>
      <div><strong id="invite-room"></strong><span id="invite-server"></span></div>
      <button id="invite-clear" class="icon-btn" title="Einladung verwerfen" data-icon="close"></button>
    </div>
    <div id="share-destination" class="share-destination" role="group" aria-label="Wie möchtest du teilen?">
      <button type="button" data-destination="link" aria-pressed="true"><i data-icon="link"></i>Per Link teilen</button>
      <button type="button" data-destination="contacts" aria-pressed="false"><i data-icon="users"></i>Kontakte</button>
    </div>
    <div id="fixed-call-banner" class="banner" hidden><strong id="fixed-call-label"></strong><button id="fixed-call-change" class="pill secondary">Empfänger ändern</button></div>
    <div id="fixed-rooms" hidden></div>

    <!-- what to share (also to change a running share) -->
    <section id="picker">
      <h1 class="picker-title" id="picker-title">Was sollen die anderen sehen?</h1>
      <p class="picker-lead" id="picker-lead">Klicke auf deinen Bildschirm oder auf ein Fenster.</p>
      <div class="panel-head">
        <div class="tabs" role="tablist">
          <button class="tab active" data-kind="screen"><i data-icon="screen"></i>Bildschirme</button>
          <button class="tab" data-kind="window"><i data-icon="window"></i>Fenster</button>
        </div>
        <button id="refresh" class="icon-btn" title="Aktualisieren" data-icon="refresh"></button>
      </div>
      <div id="grid" class="grid"></div>
      <div class="panel-foot">
        <select id="room-choice" class="room-choice" title="Welcher Link für diese Freigabe gilt – wer ihn kennt, muss trotzdem erst zugelassen werden"></select>
        <input id="name" maxlength="32" placeholder="Dein Name (sehen die Zuschauer)">
        <button id="cancel-switch" class="pill secondary" hidden>Abbrechen</button>
        <button id="start" class="pill primary" disabled><i data-icon="share"></i><span id="start-label">Freigabe starten</span></button>
      </div>
      <p class="start-hint" id="start-hint"></p>
    </section>

    <p id="error" class="error" hidden></p>
  </main>

  <div id="toast" class="toast" hidden><i data-icon="check"></i><span></span></div>

  <script type="module" src="app.js"></script>
</body>
</html>
