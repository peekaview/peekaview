<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Kontakte – PeekaView</title>
  <link rel="stylesheet" href="fixed-rooms.css">
  <link rel="manifest" href="rooms.webmanifest">
  <link rel="apple-touch-icon" href="room-icon.png">
  <style>body{margin:0;padding:22px;background:#09090b;color:#fafafa;font-family:system-ui}main{max-width:1500px;margin:auto}h1{font-size:20px;margin:0 0 20px}</style>
</head>
<body><main><h1>Kontakte</h1><div id="fixed-rooms"></div></main>
<script type="module">
  import { mountRooms } from './fixed-rooms.js'
  const p = new URLSearchParams(location.hash.slice(1))
  mountRooms(document.getElementById('fixed-rooms'),{callId:p.get('call')||'',invitation:p.get('invite')||'',invitationApi:p.get('api')||''})
</script>
</body>
</html>
